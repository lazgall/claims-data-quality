name: Run Claims Tests

on:
  pull_request:
    branches:
      - main

env:
  CLAIMS_API_KEY: ${{ secrets.CLAIMS_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest
